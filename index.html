<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reborn AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #000;
    }

    header {
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
    }

    .logo {
      font-weight: bold;
      font-size: 18px;
    }

    .hero {
      text-align: center;
      padding: 120px 20px;
    }

    .hero h1 {
      font-size: 64px;
      margin: 0;
    }

    .hero p {
      font-size: 18px;
      opacity: 0.7;
      margin-top: 10px;
    }

    .btn {
      margin-top: 30px;
      padding: 14px 28px;
      background: black;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      padding: 60px;
      text-align: center;
    }

    .card {
      border: 1px solid #eee;
      padding: 20px;
      border-radius: 12px;
    }

    footer {
      text-align: center;
      padding: 40px;
      font-size: 12px;
      opacity: 0.6;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">REBORN AI</div>
</header>

<section class="hero">
  <h1>Reborn AI</h1>
  <p>AI SaaS System for Automation, Sales & Growth</p>

  <button class="btn">Start Free</button>
</section>

<section class="features">
  <div class="card">🤖 AI Agents</div>
  <div class="card">⚙️ Automation</div>
  <div class="card">💬 Messaging AI</div>
  <div class="card">📊 Analytics</div>
  <div class="card">💳 Monetization</div>
  <div class="card">🚀 Growth System</div>
</section>

<footer>
  © 2026 Reborn AI — All rights reserved
</footer>

</body>
</html>
